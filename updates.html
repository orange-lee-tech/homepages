<!DOCTYPE html>

<head>

  <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />
  <link rel="stylesheet" href="static/css/archive.css?v=graphite-archive-4" />

<body class="archive-page archive-subpage" data-archive-page="updates">
  <header data-archive-chrome></header>
  <main class="subpage-main">
    <div class="subpage-shell">
      <section class="value-hero" aria-labelledby="updates-title">
        <div>
          <p class="subpage-eyebrow" id="updates-eyebrow">UPDATES</p>
          <h1 id="updates-title">动态</h1>
          <nav class="anchor-index" aria-label="Update sections">
            <a href="#images" id="updates-images-link">图片动态</a>
            <a href="#documents" id="updates-documents-link">文档动态</a>
          </nav>
        </div>
        <div>
          <p class="page-value-statement" id="updates-value"></p>
          <p class="page-catalog-note" id="updates-note"></p>
        </div>
      </section>
      <p id="updates-state" class="subpage-status" role="status" aria-live="polite"></p>
      <div class="updates-stream" id="updates-stream"></div>
    </div>
  </main>
  <footer data-archive-footer></footer>

  <dialog id="media-dialog" class="media-dialog" aria-labelledby="media-dialog-caption">
    <div class="media-dialog-toolbar">
      <p id="media-dialog-caption"></p>
      <button type="button" id="media-dialog-close" class="media-dialog-close" aria-label="Close">×</button>
    </div>
    <img id="media-dialog-image" alt="" />
  </dialog>

  <script src="static/js/archive-chrome.js?v=privacy-metrics-1"></script>
  <script src="static/js/updates.js?v=archive-ia-3"></script>
