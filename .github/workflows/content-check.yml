name: Content Quality Check

on:
  push:
    branches:
      - main
      - refactor/content-maintenance
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  content-check:
    name: Validate homepage content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build generated catalogs
        run: npm run build

      - name: Validate generated output
        run: npm run build:check

      - name: Validate repository content
        run: npm run check

      - name: Ensure generated files are committed
        run: git diff --exit-code
