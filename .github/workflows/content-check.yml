name: Content and Build Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: content-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Generate content outputs
        run: npm run build

      - name: Verify generated outputs
        run: npm run build:check

      - name: Validate content
        run: npm run check

      - name: Check whitespace errors
        run: git diff --check

      - name: Reject dependency artifacts
        shell: bash
        run: |
          if git status --short | grep -E '(^|[[:space:]])node_modules/|package-lock\.json$'; then
            echo "Forbidden dependency artifact detected."
            git status --short
            exit 1
          fi

      - name: Ensure generated files are committed
        run: git diff --exit-code
