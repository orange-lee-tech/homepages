name: Finish Approved Content Refactor

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.event.head_commit.message == 'chore: finish approved content refactor' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Create validated commits
        shell: bash
        env:
          BOOTSTRAP_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          validate_repo() {
            npm run build
            npm run build:check
            npm run check
            git diff --check
            git status --short
            if git status --short | grep -E '(^|[[:space:]])node_modules/|package-lock\.json$'; then
              echo "Forbidden dependency artifact detected."
              exit 1
            fi
          }

          write_files() {
            FILE_MAP="$1" python3 -c 'import base64,json,os,pathlib; files=json.loads(os.environ["FILE_MAP"]); [(pathlib.Path(p).parent.mkdir(parents=True,exist_ok=True), pathlib.Path(p).write_bytes(base64.b64decode(v)), print("wrote "+p)) for p,v in files.items()]'
          }

          echo "Commit 3/4: clarify content boundaries"
          git show "${BOOTSTRAP_SHA}^:.github/workflows/content-check.yml" > .github/workflows/content-check.yml
          write_files '{"contents/zh/about.md":"","contents/en/about.md":"","contents/zh/interests.md":"快速理解？

</div>

</div>
","contents/en/interests.md":"","content/projects.yml":"彙?","content/research.yml":"?"}'
          validate_repo
          git add -A
          git commit --amend -m "content: clarify profile and research boundaries"

          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_sha" != "$BOOTSTRAP_SHA" ]; then
            echo "main moved during migration; refusing to rewrite."
            exit 1
          fi
          git push --force-with-lease=refs/heads/main:"$BOOTSTRAP_SHA" origin HEAD:main

          echo "Commit 4/4: reorganize achievements"
          write_files '{"contents/zh/awards.md":"","contents/en/awards.md":""}'
          validate_repo
          git add -A
          git commit -m "content: reorganize achievements and certificates"
          git push origin HEAD:main
