  - id: evaluation-protocol
    category: methodology
    status: maintained
    updated: 2026-07
    title:
      zh: 统一评价口径与基线体系
      chinese-traditional: 統一評價口徑與基線體系
      en: Evaluation Protocol and Baselines
    summary:
      zh: 在比较模型之前固定数据划分、误差指标、推理成本与稳定性标准，避免因实验口径不一致产生误导性结论。
      chinese-traditional: 在比較模型之前固定資料切分、誤差指標、推論成本與穩定性標準，避免因實驗口徑不一致產生誤導性結論。
      en: Fixing data splits, error metrics, inference cost, and stability criteria before model comparison to prevent misleading conclusions.
    tags: [Baseline, Metrics, Ablation, Reproducibility]

