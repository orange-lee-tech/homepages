    status: active
    updated: 2026-07
    title:
      zh: 实验、消融与失败模式证据链
      chinese-traditional: 實驗、消融與失敗模式證據鏈
      en: Experiments, Ablations, and Failure Modes
    summary:
      zh: 将实验结果、消融设计、可视化诊断和失败模式统一组织，使每个结论都能追溯到数据、代码与评价指标。
      chinese-traditional: 將實驗結果、消融設計、視覺化診斷與失敗模式統一組織，使每個結論都能追溯到資料、程式碼與評價指標。
      en: Organizing results, ablations, visual diagnostics, and failure modes so every conclusion is traceable to data, code, and metrics.
