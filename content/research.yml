    title:
      zh: Neural Chorin：不可压流体神经算子
      chinese-traditional: Neural Chorin：不可壓流體神經算子
      en: Neural Chorin for Incompressible Flow
    summary:
      zh: 研究物理约束增强神经算子在不可压流体方程中的稳定性、泛化与可解释性，目标是建立可复现、可对比的论文级实验链路。
      chinese-traditional: 研究物理約束增強神經算子在不可壓流體方程式中的穩定性、泛化與可解釋性，目標是建立可重複、可對比的論文級實驗鏈路。
      en: Studying stability, generalization, and interpretability of physics-constrained neural operators for incompressible flow through a reproducible paper-grade experimental pipeline.
    tags: [Neural Operator, Fluid Mechanics, PDE, Physics Constraints]
