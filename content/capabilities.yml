version: 2
page:
  eyebrow:
    zh: 能力档案
    chinese-traditional: 能力檔案
    en: Capability Archive
  title:
    zh: 能力定义与证据
    chinese-traditional: 能力定義與證據
    en: Capability Definitions and Evidence
  description:
    zh: 雷达图是年度快照；这里记录每项能力的定义、形成时间与可公开核验的事实。
    chinese-traditional: 雷達圖是年度快照；此處記錄每項能力的定義、形成時間與可公開核驗的事實。
    en: The radar is a yearly snapshot. This archive records definitions, formation history, and publicly verifiable evidence.
items:
  - id: energy-power
    title:
      zh: 能源与动力
      chinese-traditional: 能源與動力
      en: Energy and Power Engineering
    definition:
      zh: 能源动力工程基础、热工问题理解及相关工程实践能力。
      chinese-traditional: 能源動力工程基礎、熱工問題理解及相關工程實踐能力。
      en: Foundations in energy and power engineering, thermal problems, and related engineering practice.
    levels:
      - year: 2026
        level: 2
        primary: true
    tools:
      - Engineering Economy
      - Thermal Sciences
      - Experiment Design
    evidence:
      - text:
          zh: 中南大学能源与动力工程本科阶段学习。
          chinese-traditional: 中南大學能源與動力工程本科階段學習。
          en: Undergraduate study in Energy and Power Engineering at Central South University.
      - text:
          zh: 2026 年元智大学机械工程学系交换，完成 9 学分课程。
          chinese-traditional: 2026 年元智大學機械工程學系交換，完成 9 學分課程。
          en: Completed nine credits during a 2026 exchange in Mechanical Engineering at Yuan Ze University.
        target: learning.html#interests
      - text:
          zh: 参与锑资源清洁能源与钨资源回收项目，并参加中科院近物所 HIAF 与 CiADS 冬令营。
          chinese-traditional: 參與銻資源清潔能源與鎢資源回收專案，並參加中科院近物所 HIAF 與 CiADS 冬令營。
          en: Worked on antimony and tungsten engineering projects and joined the IMP HIAF/CiADS winter camp.
        target: projects.html#record-antimony-clean-energy
  - id: ansys
    title:
      zh: ANSYS 仿真
      chinese-traditional: ANSYS 模擬
      en: ANSYS Simulation
    definition:
      zh: 使用数值仿真工具理解工程边界条件、模型设置与结果解释。
      chinese-traditional: 使用數值模擬工具理解工程邊界條件、模型設定與結果解釋。
      en: Using numerical simulation tools to reason about boundary conditions, model setup, and result interpretation.
    levels:
      - year: 2026
        level: 4
        primary: false
    tools:
      - ANSYS
    evidence: []
  - id: ai-agent
    title:
      zh: AI Agent 工程
      chinese-traditional: AI Agent 工程
      en: AI Agent Engineering
    definition:
      zh: Agent Runtime、工具调用、MCP、Skill、记忆与本地 AI 系统的工程化实践。
      chinese-traditional: Agent Runtime、工具調用、MCP、Skill、記憶與本地 AI 系統的工程化實踐。
      en: Engineering practice across agent runtimes, tool calls, MCP, skills, memory, and local AI systems.
    levels:
      - year: 2026
        level: 3
        primary: false
    tools:
      - Electron
      - React
      - MCP
      - Ollama
      - Playwright
    evidence:
      - text:
          zh: 持续开发桌面 AI Agent Runtime，覆盖工具运行、MCP、Skill、记忆与 Electron 测试。
          chinese-traditional: 持續開發桌面 AI Agent Runtime，涵蓋工具執行、MCP、Skill、記憶與 Electron 測試。
          en: Ongoing development of a desktop AI agent runtime covering tools, MCP, skills, memory, and Electron testing.
        target: projects.html
  - id: research-engineering
    title:
      zh: 科研工程与项目发起
      chinese-traditional: 科研工程與專案發起
      en: Research Engineering & Project Initiation
    definition:
      zh: 通过团队组建、文档基础设施、计算资源组织与工程治理，使研究项目能够启动、持续迭代并完成成果转化。
      chinese-traditional: 透過團隊組建、文件基礎設施、計算資源組織與工程治理，使研究專案能夠啟動、持續迭代並完成成果轉化。
      en: >-
        Enabling research projects to start, iterate, and convert into outcomes through team formation, document infrastructure, compute
        organization, and engineering governance.
    tools:
      - LaTeX
      - GPU Workflow
      - File Governance
      - Project Coordination
    evidence:
      - text:
          zh: 发起 MathorCup 汽车风阻项目并推动 BRFC 论文转化；通过工程管理将 GPU 平均利用效率由约 40% 提升至约 90%。
          chinese-traditional: 發起 MathorCup 汽車風阻專案並推動 BRFC 論文轉化；透過工程管理將 GPU 平均利用效率由約 40% 提升至約 90%。
          en: >-
            Initiated the MathorCup aerodynamic project and sustained its conversion into BRFC, raising average GPU utilization from about
            40% to about 90% through engineering management.
        target: learning.html#record-mathorcup-brfc
  - id: full-stack
    title:
      zh: 全栈开发
      chinese-traditional: 全端開發
      en: Full-stack Development
    definition:
      zh: 从界面、运行时、内容管线到部署与维护的软件系统构建能力。
      chinese-traditional: 從介面、執行環境、內容管線到部署與維護的軟體系統構建能力。
      en: Building software systems across interfaces, runtimes, content pipelines, deployment, and maintenance.
    levels:
      - year: 2025
        level: 2
        primary: false
      - year: 2026
        level: 5
        primary: false
    tools:
      - HTML
      - CSS
      - JavaScript
      - React
      - Electron
      - Node.js
      - GitHub Actions
    evidence:
      - text:
          zh: 开发 IELTS Learning Assistant 浏览器扩展。
          chinese-traditional: 開發 IELTS Learning Assistant 瀏覽器擴充功能。
          en: Developed the IELTS Learning Assistant browser extension.
        target: projects.html
      - text:
          zh: 建立个人主页 YAML 内容源、生成管线与 GitHub Pages 发布体系。
          chinese-traditional: 建立個人主頁 YAML 內容來源、生成管線與 GitHub Pages 發布體系。
          en: Built the homepage YAML sources, generation pipeline, and GitHub Pages publishing workflow.
        target: projects.html
  - id: reading-notes
    title:
      zh: 读书笔记
      chinese-traditional: 讀書筆記
      en: Reading Notes
    definition:
      zh: 围绕工程、实验设计、财务判断与方法论进行长期知识整理。
      chinese-traditional: 圍繞工程、實驗設計、財務判斷與方法論進行長期知識整理。
      en: Long-term knowledge organization around engineering, experiment design, financial judgment, and methodology.
    levels:
      - year: 2026
        level: 4
        primary: false
    tools:
      - Markdown
      - Knowledge Base
      - Reading Plans
    evidence:
      - text:
          zh: 2026 年 6 月确定《工程经济》《实验设计与分析》《热交换设计》《财务管理》四本专业书的长期学习计划。
          chinese-traditional: 2026 年 6 月確定《工程經濟》《實驗設計與分析》《熱交換設計》《財務管理》四本專業書的長期學習計畫。
          en: >-
            Established a long-term study plan around four books on engineering economy, experimental design, heat exchanger design, and
            financial management in June 2026.
        target: learning.html#interests
  - id: latex
    title:
      zh: LaTeX 排版
      chinese-traditional: LaTeX 排版
      en: LaTeX Typesetting
    definition:
      zh: 科研文档、数学表达与论文材料的结构化排版能力。
      chinese-traditional: 科研文件、數學表達與論文材料的結構化排版能力。
      en: Structured typesetting for research documents, mathematics, and paper materials.
    levels:
      - year: 2024
        level: 3
        primary: false
      - year: 2025
        level: 4
        primary: false
    tools:
      - LaTeX
    evidence:
      - text:
          zh: 数学建模与科研材料中持续使用 LaTeX 进行结构化表达。
          chinese-traditional: 數學建模與科研材料中持續使用 LaTeX 進行結構化表達。
          en: Continued use of LaTeX for structured mathematical modeling and research materials.
      - text:
          zh: 在 STR、MCM、MathorCup—BRFC 等项目中承担论文结构、LaTeX 模板或制版工作。
          chinese-traditional: 在 STR、MCM、MathorCup—BRFC 等專案中承擔論文結構、LaTeX 模板或製版工作。
          en: Handled paper structure, LaTeX templates, or typesetting in STR, MCM, and MathorCup–BRFC projects.
        target: learning.html#record-mathorcup-brfc
  - id: solidworks
    title:
      zh: SolidWorks 仿真
      chinese-traditional: SolidWorks 模擬
      en: SolidWorks Simulation
    definition:
      zh: 三维建模、设备表达、3D 打印准备与工程设计沟通。
      chinese-traditional: 三維建模、設備表達、3D 列印準備與工程設計溝通。
      en: 3D modeling, equipment communication, 3D-print preparation, and engineering design.
    levels:
      - year: 2024
        level: 1
        primary: false
      - year: 2025
        level: 4
        primary: false
    tools:
      - SolidWorks
      - 3D Printing
    evidence:
      - text:
          zh: 清洁低碳能源项目中承担设备说明书、SolidWorks 建模与 3D 打印相关工作。
          chinese-traditional: 清潔低碳能源專案中承擔設備說明書、SolidWorks 建模與 3D 列印相關工作。
          en: Worked on equipment documentation, SolidWorks modeling, and 3D printing in a clean-energy project.
        target: learning.html#research
  - id: collaboration
    title:
      zh: 团队协作
      chinese-traditional: 團隊協作
      en: Collaboration
    definition:
      zh: 在多人竞赛、科研与工程项目、课程团队、公益组织和学生工作中，通过明确分工、持续沟通、资料交接、共同决策与按期交付完成共同目标。
      chinese-traditional: 在多人競賽、科研與工程專案、課程團隊、公益組織和學生工作中，透過明確分工、持續溝通、資料交接、共同決策與按期交付完成共同目標。
      en: >-
        Completing shared goals in team competitions, research and engineering projects, course teams, service organizations, and student
        work through clear roles, sustained communication, handovers, joint decisions, and timely delivery.
    levels:
      - year: 2024
        level: 3
        primary: true
      - year: 2025
        level: 4
        primary: true
    tools:
      - Team Formation
      - Role Division
      - Project Coordination
      - Documentation
      - Handover
      - Public Communication
    evidence:
      - text:
          zh: STR、火箭残骸、MCM 与 MathorCup—BRFC 均为多人建模或科研项目，承担主持、领队、论文结构、LaTeX 制版、代码材料组织或计算流程治理。
          chinese-traditional: STR、火箭殘骸、MCM 與 MathorCup—BRFC 均為多人建模或科研專案，承擔主持、領隊、論文結構、LaTeX 製版、程式材料組織或計算流程治理。
          en: >-
            STR, rocket-debris modeling, MCM, and MathorCup–BRFC were multi-person modeling or research projects involving leadership, paper
            structure, LaTeX production, code organization, or compute-workflow governance.
        target: projects.html#record-str-forensic-modeling
      - text:
          zh: 锑与钨工程项目、新能源材料实验室和清洁低碳能源工程研究中心均涉及多人研发、三维建模、实验材料和赛事交付。
          chinese-traditional: 銻與鎢工程專案、新能源材料實驗室和清潔低碳能源工程研究中心均涉及多人研發、三維建模、實驗材料和賽事交付。
          en: >-
            The antimony and tungsten projects, new-energy-materials lab, and clean-energy research center involved team R&D, 3D modeling,
            experimental work, and competition delivery.
        target: projects.html#record-antimony-clean-energy
      - text:
          zh: 元智大学六人读书会通过分工精读、六次线下会议与个人报告共同交付并获全校第二名。
          chinese-traditional: 元智大學六人讀書會透過分工精讀、六次線下會議與個人報告共同交付並獲全校第二名。
          en: >-
            The six-member Yuan Ze study group delivered assigned reading, six in-person meetings, and individual reports, placing second
            university-wide.
        target: learning.html#record-yuan-ze-study-group
      - text:
          zh: 学工办、母校联合宣讲、湖南百公里和小问号 weekend 分别形成跨部门交接、17 校联合组织、招募传播与四人课程组管理证据。
          chinese-traditional: 學工辦、母校聯合宣講、湖南百公里和小問號 weekend 分別形成跨部門交接、17 校聯合組織、招募傳播與四人課程組管理證據。
          en: >-
            Student-office work, joint school outreach, Hunan 100 km, and Question Mark Weekend provide evidence of cross-unit handovers, a
            17-university organization, recruitment communication, and management of a four-person curriculum team.
        target: projects.html#record-question-mark-weekend
  - id: wps
    title:
      zh: WPS 三件套
      chinese-traditional: WPS 三件套
      en: Office Productivity
    definition:
      zh: 文档、表格、演示与日常协同材料的可靠制作能力。
      chinese-traditional: 文件、試算表、簡報與日常協同材料的可靠製作能力。
      en: Reliable production of documents, spreadsheets, presentations, and operational materials.
    levels:
      - year: 2024
        level: 4
        primary: false
    tools:
      - WPS Writer
      - WPS Spreadsheets
      - WPS Presentation
    evidence:
      - text:
          zh: 学生工作与项目管理中持续承担文档、档案、信息表与展示材料制作。
          chinese-traditional: 學生工作與專案管理中持續承擔文件、檔案、資訊表與展示材料製作。
          en: Produced documents, records, information sheets, and presentation materials for student work and projects.
        target: projects.html#collaboration
      - text:
          zh: 全国计算机等级考试二级（WPS Office）为文档、表格和演示制作能力提供证书证据。
          chinese-traditional: 全國計算機等級考試二級（WPS Office）為文件、試算表和簡報製作能力提供證書證據。
          en: >-
            The National Computer Rank Examination Level 2 (WPS Office) provides certificate evidence for document, spreadsheet, and
            presentation skills.
        target: capabilities.html#record-wps-and-certifications
  - id: academic-graphic-design
    title:
      zh: 平面设计
      chinese-traditional: 平面設計
      en: Graphic Design
    definition:
      zh: 需求理解、视觉表达、信息排版与设计交付能力。
      chinese-traditional: 需求理解、視覺表達、資訊排版與設計交付能力。
      en: Requirement understanding, visual communication, information layout, and design delivery.
    levels:
      - year: 2024
        level: 4
        primary: false
      - year: 2025
        level: 5
        primary: false
    tools:
      - Photoshop
      - Illustrator
      - Layout
    evidence:
      - text:
          zh: 在昆明上维设计品牌有限公司实习期间参与需求对接与交付，在职完成 4 份作品，累计作品 14 个。
          chinese-traditional: 在昆明上維設計品牌有限公司實習期間參與需求對接與交付，在職完成 4 份作品，累計作品 14 個。
          en: >-
            Participated in client communication and delivery during a design internship, completing four internship works and fourteen
            works in total.
        target: projects.html#collaboration
