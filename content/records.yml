- id: imp-muon-thermal-internship
  kind: research
  pages:
  - projects
  - learning
  - capabilities
  size: extended
  featured: true
  timelineDate: '2026-08-28'
  timelineType: milestone
  title:
    zh: 中国科学院近代物理研究所实习 8 周
    en: Eight-week Internship at the Institute of Modern Physics, CAS
  period:
    zh: 2026-07-06—2026-08-28（正在进行）
    en: 2026-07-06—2026-08-28 (ongoing)
  role:
    zh: 科研实习生
    en: Research intern
  summary:
    zh: 在广东惠州中国科学院近代物理研究所开展八周科研实习，围绕缪子运输工程热工分析，使用 ANSYS Fluent 并依托超算集群开展模拟仿真；目前仍在实习中，阶段性校核表明，在所研究的物理耦合场参数组下安全裕度充足。
    en: Conducting an eight-week research internship at the Institute of Modern Physics in Huizhou, Guangdong, focused on thermal analysis for muon transport engineering using ANSYS Fluent on a supercomputing cluster; interim checks indicate adequate safety margins under the studied coupled-field parameter set.
  actions:
  - zh: 围绕缪子运输工程开展热工分析，整理边界条件、工况与校核参数。
    en: Conducted thermal analysis for muon transport engineering and organized boundary conditions, operating cases, and verification parameters.
  - zh: 使用 ANSYS Fluent 建立并运行数值模型，依托超算集群完成模拟仿真。
    en: Built and ran numerical models in ANSYS Fluent on a supercomputing cluster.
  - zh: 对物理耦合场参数组进行阶段性校核，并评估关键工况下的安全裕度。
    en: Performed interim checks across coupled-field parameter sets and assessed safety margins under key operating conditions.
  outcomes:
  - zh: 当前阶段结果显示，在已校核的物理耦合场参数组下安全裕度充足。
    en: Current results indicate adequate safety margins under the verified coupled-field parameter set.
  - zh: 形成 ANSYS Fluent、超算集群与工程热工分析相结合的科研实践。
    en: Built hands-on research experience combining ANSYS Fluent, high-performance computing, and engineering thermal analysis.
  tags:
  - zh: 中科院近物所
    en: Institute of Modern Physics, CAS
