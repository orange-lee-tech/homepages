  featured: true
  timelineDate: '2025-08-11'
  timelineType: milestone
  title:
    zh: “锑”旧焕新：可再生锑光热化学储热项目
    en: 'Antimony Renewal: Renewable Antimony Solar-Thermochemical Storage'
  period: 2025-06—2025-08-11
  role:
    zh: 学生项目副主持
    en: Student deputy project lead
  summary:
    zh: 围绕锑尾矿与冶金渣资源化，团队利用湿法冶金回收锑资源，并开发适配的热化学储热吸热器与智能调控系统；本人承担副主持、三维建模与赛事表达工作。
    en: The team recovered antimony from tailings and metallurgical slag through hydrometallurgy and developed a thermochemical-storage receiver
      with intelligent control; the user served as deputy lead and handled 3D modeling and competition communication.
  actions:
  - zh: 分担团队组织、协作与现场答辩交付工作。
    en: Shared team organization, collaboration, and on-site defense delivery.
  - zh: 负责装置 3D 建模与科技作品的设计表达。
    en: Handled device 3D modeling and engineering presentation.
  - zh: 负责宣传视频的策划与剪辑。
    en: Planned and edited the promotional video.
  outcomes:
  - zh: 形成作品《“锑”旧焕新——一种基于可再生锑的光热化学储热系统》。
    en: Produced the project “Antimony Renewal — a solar-thermochemical storage system based on renewable antimony.”
  - zh: 获第十八届全国大学生节能减排竞赛全国一等奖。
    en: Won national first prize in the 18th national energy-conservation competition.
  - zh: 同时获湖南省第三届大学生节能减排竞赛二等奖。
    en: Also won second prize in the third Hunan provincial competition.
  tags:
  - zh: 能源工程
    en: Energy Engineering
  - zh: 资源回收
    en: Resource Recovery
  - zh: 储热
    en: Thermal Storage
  - zh: 3D 建模
    en: 3D Modeling
