  timelineDate: '2025-08-28'
  timelineType: progress
  title:
    zh: STR 混合样本分析：同一项目的三项赛事成果
    en: 'STR Mixture Analysis: One Project, Three Competition Outcomes'
  period: 2025-04-28—2025-08-28
  role:
    zh: 项目主持 / 论文与排版组织
    en: Project lead / writing and typesetting coordination
  summary:
    zh: 主持“法医物证多人身份鉴定问题数据集”项目，围绕 STR 混合样本的等位基因分析与去噪完成四个子问题、论文和现场答辩，并在校级、省级与全国赛事中连续转化。
    en: Led a forensic multi-person identification project, completing four subproblems on STR-mixture allele analysis and denoising, the paper,
      and on-site defense, with outcomes across university, provincial, and national competitions.
  actions:
  - zh: 担任项目主持，组织团队分工、论文结构与答辩材料。
    en: Served as project lead, organizing team roles, paper structure, and defense materials.
  - zh: 主持论文写作与 LaTeX 制版，并使用 VS Code 管理代码和材料。
    en: Led paper writing and LaTeX typesetting and managed code and materials in VS Code.
  - zh: 围绕 STR 混合样本等位基因分析提出高效去噪方案。
    en: Developed an efficient denoising approach for allele analysis in STR mixtures.
  outcomes:
  - zh: 形成论文《基于机器学习的 STR 混合样本等位基因分析与去噪方法研究》。
    en: Produced the paper “Machine-learning-based allele analysis and denoising for STR mixture samples.”
  - zh: 获中南大学第二十届数学建模竞赛一等奖。
    en: Won first prize in the 20th CSU Mathematical Modeling Competition.
  - zh: 在湖南省选拔阶段排名第二，最终获湖南省大学生数学建模竞赛三等奖。
    en: Ranked second in the Hunan selection stage and ultimately won third prize in the Hunan Provincial Mathematical Modeling Competition.
  - zh: 获 2025 深圳杯数学建模挑战赛全国优秀论文。
    en: Received a National Outstanding Paper award in the 2025 Shenzhen Cup.
