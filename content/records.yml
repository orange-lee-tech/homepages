  title:
    zh: 清洁低碳能源工程研究中心：钨资源回收与设备专利链
    en: 'Clean and Low-carbon Energy Research Center: Tungsten Recovery and Device Patent Chain'
  period: 2024-10-07—2025-05-10
  role:
    zh: 学生项目主持 / 钨项目成员
    en: Student project lead / tungsten-project member
  summary:
    zh: 在清洁低碳能源技术湖南省工程研究中心推进设备说明书、三维建模、实验图表和赛事材料；钨资源回收装置形成省赛与授权专利证据，另有“超快高温速控一体机”专利申请在办。
    en: Advanced equipment documentation, 3D modeling, experimental figures, and competition materials at the Hunan Engineering Research Center
      for Clean and Low-carbon Energy; the tungsten-recovery device produced provincial-competition and granted-patent evidence, while the Ultra-fast
      High-temperature Integrated Controller patent remains pending.
  actions:
  - zh: 使用 SolidWorks 建立符合设计要求的装置模型。
    en: Built the device model in SolidWorks.
  - zh: 参与设备说明书、3D 打印准备与项目材料交付。
    en: Contributed to documentation, 3D-print preparation, and project delivery.
  - zh: 使用 Origin 2024 整理实验数据图表，并参与核心赛事材料组织。
    en: Used Origin 2024 for experimental figures and helped organize core competition materials.
  outcomes:
  - zh: 获湖南省第三届大学生节能减排竞赛二等奖。
    en: Won second prize in the third Hunan provincial competition.
  - zh: 发明专利 202510469264.X 已获授权。
    en: Invention patent 202510469264.X was granted.
  - zh: 专利 202510196241.6《超快高温速控一体机》在办。
    en: Patent application 202510196241.6, Ultra-fast High-temperature Integrated Controller, remains pending.
