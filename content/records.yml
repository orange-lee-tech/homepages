- id: mathorcup-brfc
  kind: research
  pages:
  - learning
  - capabilities
  size: extended
  featured: true
  timelineDate: '2025-04-18'
  timelineType: milestone
  title:
    zh: 从第十五届 MathorCup 到 BRFC：项目发起与科研工程转化
    en: 'From the 15th MathorCup to BRFC: Project Initiation and Research Engineering'
  period: 2025-04-18—2026-07-29
  role:
    zh: 前期关键发起人 / 科研工程组织
    en: Key early-stage initiator / research engineering coordinator
  summary:
    zh: 本人承担前期关键发起与科研工程组织：组建团队、促成项目启动、提供 LaTeX 模板并重构文件与计算流程。核心方法与实验由团队其他成员主责；上述工作并不替代方法贡献，但构成项目得以成立、持续迭代并最终转化为论文的关键条件，属于明确且不可忽略的间接贡献。
    en: 'Served as the key early-stage initiator and research-engineering coordinator: formed the team, launched the project, provided the LaTeX
      template, and reorganized file and compute workflows. Other members led the core method and experiments; this work did not replace methodological
      contributions, but it was a clear and indispensable indirect contribution that enabled the project to form, keep iterating, and ultimately
      become a paper.'
  actions:
  - zh: 作为领队发起组队、聚合成员并启动汽车风阻项目。
    en: As team leader, formed the team and launched the vehicle-drag project.
  - zh: 分担竞赛论文写作、LaTeX 制版和 ParaView 汽车风阻模拟仿真。
    en: Shared competition-paper writing, LaTeX typesetting, and ParaView vehicle-drag simulation.
  - zh: 提供统一 LaTeX 模板，重整课题组文件结构与科研工程流程。
    en: Provided a shared LaTeX template and reorganized the group’s file structure and research-engineering workflow.
  - zh: 优化计算任务管理，将课题组 GPU 平均利用效率由约 40% 提升至约 90%。
    en: Improved compute-task management, raising average GPU utilization from about 40% to about 90%.
  outcomes:
  - zh: 竞赛阶段形成论文《基于 FD-PINO 神经网络模型预测汽车风阻》。
    en: The competition phase produced “Vehicle-drag prediction based on an FD-PINO neural-network model.”
  - zh: 获第十五届 MathorCup 华中赛区三等奖。
    en: Won third prize in the 15th MathorCup Central China region.
  - zh: 降低资源空闲、迭代等待与试错成本，也降低团队因反馈周期过长而放弃项目的风险。
    en: Reduced idle compute, iteration waiting, and experimentation cost, while lowering the risk of project abandonment caused by slow feedback
      cycles.
  - zh: BRFC 作者顺序为 Jinlong Li、Fengyi Zhang、Yongjie Hu、Yucheng Li、Shengjun Liu；Yucheng Li 位列第四。
    en: BRFC author order is Jinlong Li, Fengyi Zhang, Yongjie Hu, Yucheng Li, and Shengjun Liu; Yucheng Li is fourth author.
  - zh: 论文于 2026-07-20 提交 AAAI 2027，公开记录显示 2026-07-29 修改。
    en: The paper was submitted to AAAI 2027 on 2026-07-20 and the public record shows a modification on 2026-07-29.
