- id: tungsten-recycling
  kind: engineering
  pages:
  - projects
  - capabilities
  size: extended
  featured: true
  timelineDate: '2025-05-10'
  timelineType: progress
  title:
    zh: 清洁低碳能源工程研究中心：钨资源回收与设备专利链
    en: 'Clean and Low-carbon Energy Research Center: Tungsten Recovery and Device Patent Chain'
  period:
    zh: 工程研究中心经历 2024-10—2025-08；钨项目竞赛阶段 2024-10-07—2025-05-10
    en: 'Research-center period: 2024-10—2025-08; tungsten competition phase: 2024-10-07—2025-05-10'
  role:
    zh: 学生项目主持 / 钨项目成员
    en: Student project lead / tungsten-project member
  summary:
    zh: 在清洁低碳能源技术湖南省工程研究中心参与科研成果转化、设备研发与赛事组织；其中钨资源回收装置形成省赛二等奖和授权发明专利，另一项高温速控设备专利仍在办理。
    en: At the Hunan Engineering Research Center for Clean and Low-carbon Energy Technology, contributed to research commercialization, equipment
      development, and competition delivery; the tungsten-recovery device won a provincial second prize and obtained a granted invention patent,
      while another high-temperature controller patent remains pending.
  actions:
  - zh: 率队撰写设备说明书并组织核心赛事材料。
    en: Led preparation of equipment manuals and core competition materials.
  - zh: 使用 SolidWorks 建立符合设计需求的设备模型，并为 3D 打印做准备。
    en: Built design-compliant equipment models in SolidWorks and prepared them for 3D printing.
  - zh: 使用 Origin 2024 绘制实验数据图表。
    en: Produced experimental data figures with Origin 2024.
  - zh: 参与节能减排、创新创业类赛事及专利申报。
    en: Participated in energy-conservation and innovation competitions and patent applications.
  outcomes:
  - zh: 形成作品《“钨”尽其用——一种基于氢冶金原理的可移动式钨资源回收装置设计》。
    en: Produced “Making Full Use of Tungsten — a mobile tungsten-recovery device based on hydrogen metallurgy.”
  - zh: 获湖南省第三届大学生节能减排竞赛二等奖。
    en: Won second prize in the third Hunan provincial energy-conservation competition.
  - zh: 发明专利 202510469264.X《一种基于氢冶金原理的可移动式钨资源回收装置》已获授权。
    en: Invention patent 202510469264.X, a mobile tungsten-recovery device based on hydrogen metallurgy, was granted.
  - zh: 专利申请 202510196241.6《超快高温速控一体机》仍在办理，不能与已授权专利混同。
    en: Patent application 202510196241.6, Ultra-fast High-temperature Integrated Controller, remains pending and is distinct from the granted
      patent.
  - zh: 2026 年校级创新训练项目《炽火工坊——基于 PID 算法精准控制的焦耳热一体机》结题良好。
    en: The 2026 university innovation-training project “Chihuo Workshop — a PID-controlled Joule-heating integrated system” completed with a
      good evaluation.
  - zh: 该研究中心经历曾形成拟衔接本科毕业论文的研究方向。
    en: The research-center work also formed a prospective direction for the undergraduate thesis.
  tags:
