  context:
  - zh: 第十八届全国大学生节能减排社会实践与科技作品竞赛由教育部高等学校能源动力类专业教学指导委员会指导，现场决赛在东北石油大学举行。
    en: The 18th National College Student Energy Conservation and Emission Reduction Competition was guided by the Ministry of Education’s energy-and-power
      teaching committee, with the on-site final at Northeast Petroleum University.
  - zh: 项目任务是利用湿法冶金从锑尾矿和冶金渣中提取锑资源，并开发适配的热化学储热吸热器和智能调控系统。
    en: The project task was to recover antimony from tailings and metallurgical slag through hydrometallurgy and develop a matching thermochemical-storage
      receiver and intelligent control system.
