- id: mathorcup-brfc
  kind: research
  pages:
  - learning
  - capabilities
  size: extended
  featured: true
  timelineDate: '2025-04-18'
  timelineType: milestone
  title:
    zh: 从第十五届 MathorCup 到 BRFC：项目发起与科研工程转化
    en: 'From the 15th MathorCup to BRFC: Project Initiation and Research Engineering'
  period: 2025-04-18—2026-07-29
  role:
    zh: 前期关键发起人 / 科研工程组织
    en: Key early-stage initiator / research engineering coordinator
  summary:
    zh: 本人承担前期关键发起与科研工程组织：组建团队、促成项目启动、提供 LaTeX 模板并重构文件与计算流程。核心方法与实验由团队其他成员主责；上述工作并不替代方法贡献，但构成项目得以成立、持续迭代并最终转化为论文的关键条件，属于明确且不可忽略的间接贡献。
    en: 'Served as the key early-stage initiator and research-engineering coordinator: formed the team, launched the project, provided the LaTeX
      template, and reorganized file and compute workflows. Other members led the core method and experiments; this work did not replace methodological
      contributions, but it was a clear and indispensable indirect contribution that enabled the project to form, keep iterating, and ultimately
      become a paper.'
  actions:
  - zh: 发起组队、聚合成员并启动第十五届 MathorCup 汽车风阻项目。
    en: Formed the team and launched the 15th MathorCup aerodynamic-modeling project.
  - zh: 提供统一 LaTeX 模板，重整课题组文件结构与工程管理流程。
    en: Provided a shared LaTeX template and reorganized the group's file and engineering workflow.
  - zh: 优化计算任务管理，将课题组 GPU 平均利用效率由约 40% 提升至约 90%。
    en: Improved compute-task management, raising average GPU utilization from about 40% to about 90%.
  outcomes:
  - zh: 降低资源空闲、迭代等待与试错时间成本，也降低团队因反馈周期过长而中途放弃的风险。
    en: Reduced idle compute, iteration waiting, and experimentation cost, while lowering the risk of the team abandoning work because feedback
      cycles were too slow.
  - zh: MathorCup 获华中赛区三等奖。
    en: Won third prize in the MathorCup Central China region.
  - zh: 成果转化论文 BRFC 已投稿 AAAI 2027；作者顺序按 OpenReview 公开记录展示，Yucheng Li 位列第四。
    en: The resulting BRFC paper was submitted to AAAI 2027; author order follows the public OpenReview record, with Yucheng Li listed fourth.
