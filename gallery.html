<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Li Yucheng image and design archive" />
  <meta name="author" content="Li Yucheng" />
  <title>Gallery · Li Yucheng</title>
  <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />
  <link rel="stylesheet" href="static/css/archive.css?v=graphite-archive-3" />
  <script src="static/js/js-yaml.min.js"></script>
</head>
<body class="archive-page archive-subpage gallery-page">
  <header class="subpage-chrome">
    <div class="subpage-shell subpage-chrome-inner">
      <a id="gallery-brand" class="subpage-brand" href="index.html" data-preserve-lang>Graphite Archive</a>
      <nav class="subpage-nav" aria-label="Archive navigation">
        <a id="gallery-home" href="index.html" data-preserve-lang>Home</a>
        <a id="gallery-projects" href="projects.html" data-preserve-lang>Projects</a>
        <a id="gallery-research" href="research.html" data-preserve-lang>Research</a>
        <a id="gallery-knowledge" href="knowledge.html" data-preserve-lang>Knowledge</a>
        <a id="gallery-posts" href="posts.html" data-preserve-lang>Updates</a>
        <a id="gallery-gallery" aria-current="page" href="gallery.html" data-preserve-lang>Gallery</a>
      </nav>
      <div class="subpage-language" aria-label="Language selector">
        <button type="button" data-language="zh" aria-pressed="false">简</button>
        <button type="button" data-language="chinese-traditional" aria-pressed="true">繁</button>
        <button type="button" data-language="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main class="subpage-main">
    <div class="subpage-shell">
      <section class="subpage-hero" aria-labelledby="gallery-title">
        <div>
          <p class="subpage-eyebrow" id="gallery-eyebrow">IMAGE ARCHIVE</p>
          <h1 id="gallery-title">Image Archive</h1>
        </div>
        <div>
          <p id="gallery-description" class="subpage-description"></p>
          <p id="gallery-help" class="gallery-help"></p>
        </div>
      </section>
      <p id="gallery-state" class="subpage-status" role="status" aria-live="polite">Loading image archive…</p>
      <div id="gallery-collections" class="gallery-collections"></div>
    </div>
  </main>

  <footer class="subpage-footer">
    <div class="subpage-shell subpage-footer-inner">
      <span>© Li Yucheng 2023–2026 · Graphite Archive</span>
      <span><a href="https://github.com/orange-lee-tech" target="_blank" rel="noopener noreferrer">GitHub</a> · <a href="https://openreview.net/profile?id=%7EYucheng_Li13" target="_blank" rel="noopener noreferrer">OpenReview</a></span>
    </div>
  </footer>

  <dialog id="gallery-dialog" class="gallery-dialog" aria-labelledby="gallery-dialog-caption">
    <div class="gallery-dialog-toolbar">
      <p id="gallery-dialog-caption"></p>
      <button type="button" id="gallery-dialog-close" class="gallery-dialog-close" aria-label="Close">×</button>
    </div>
    <img id="gallery-dialog-image" alt="" />
  </dialog>

  <script src="static/js/gallery.js?v=graphite-archive-3"></script>
</body>
</html>
